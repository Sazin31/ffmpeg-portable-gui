[package]
name = "ffmpeg-portable-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = true }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
